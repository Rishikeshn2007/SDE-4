[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academia-voicebot-audio"
version = "0.2.0"
description = "Academia AI Voice Bot - W1 audio & W2 STT foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
google-stt = [
    "SpeechRecognition>=3.10.0",
    "sounddevice>=0.4.0",
]

[tool.setuptools.packages.find]
where = [".", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra -q"
